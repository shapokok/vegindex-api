services:
  jenkins:
    build: .
    image: vegindex-jenkins:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    # On Docker Desktop the socket inside containers is root:root with mode 660.
    # Adding the root *group* lets the non-root `jenkins` user use it without
    # running Jenkins itself as root.
    group_add:
      - "0"

volumes:
  jenkins_home:
